<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="100%" height="100%">
  <defs>
    <filter id="subtle-shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  <style>
  @keyframes flameFlicker {
    0% { transform: scale(1.0); opacity: 0.9; }
    50% { transform: scale(1.15); opacity: 1.0; }
    100% { transform: scale(1.0); opacity: 0.9; }
  }
  @keyframes ledPulse {
    0% { opacity: 0.25; }
    25% { opacity: 0.7; }
    50% { opacity: 1.0; }
    75% { opacity: 0.7; }
    100% { opacity: 0.25; }
  }
  @keyframes ledTrail {
    0% { stroke-dashoffset: 30; opacity: 0.3; }
    50% { opacity: 0.7; }
    100% { stroke-dashoffset: 0; opacity: 0.3; }
  }
  @keyframes exitSafeGlow {
    0% { stroke-width: 4; opacity: 0.85; }
    50% { stroke-width: 7; opacity: 1.0; }
    100% { stroke-width: 4; opacity: 0.85; }
  }
  @keyframes exitDangerFlash {
    0% { stroke-width: 4; opacity: 1.0; }
    50% { stroke-width: 6; opacity: 0.6; }
    100% { stroke-width: 4; opacity: 1.0; }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .flame-anim {
    animation: flameFlicker 1.2s ease-in-out infinite;
    transform-origin: center;
  }
  .led-chevron {
    animation: fadeIn 0.4s ease-out, ledPulse 2.0s ease-in-out infinite;
  }
  .led-trail {
    stroke: #10b981;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 5 10;
    fill: none;
    opacity: 0.4;
    filter: url(#led-glow-trail);
    animation: ledTrail 1.2s linear infinite;
  }
  .exit-safe {
    animation: exitSafeGlow 1.5s ease-in-out infinite;
  }
  .exit-danger {
    animation: exitDangerFlash 0.8s ease-in-out infinite;
  }
  .occupant-entity {
    animation: fadeIn 0.3s ease-out;
  }
</style><filter id="led-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge></filter><filter id="led-glow-trail" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge></filter></defs>

  
