<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="100%" height="100%">
  <defs>
    <filter id="subtle-shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1000" height="510" fill="#ffffff"/>
  <rect x="20" y="15" width="960" height="480" fill="#f8fafc" stroke="#0f172a" stroke-width="6" rx="8" filter="url(#subtle-shadow)"/>

  <line x1="120" y1="15" x2="340" y2="15" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
  <line x1="440" y1="15" x2="660" y2="15" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
  <line x1="760" y1="15" x2="920" y2="15" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>

  <!-- Executive Office 201 (R-201) -->
  <g id="room-R-201">
    <rect x="40" y="35" width="260" height="210" fill="#ffffff" stroke="#64748b" stroke-width="3" rx="6"/>
    <text x="170" y="90" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" text-anchor="middle">💼</text>
    <text x="170" y="122" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Executive Office 201</text>
    <text x="170" y="148" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">HR &amp; Operations Management</text>
  </g>

  <!-- Server Hall & Data Center (R-202) -->
  <g id="room-R-202">
    <rect x="320" y="35" width="270" height="210" fill="#f0f9ff" stroke="#0284c7" stroke-width="3" rx="6"/>
    <rect x="350" y="60" width="40" height="160" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" rx="2"/>
    <rect x="415" y="60" width="40" height="160" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" rx="2"/>
    <rect x="480" y="60" width="40" height="160" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" rx="2"/>
    <text x="455" y="100" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" text-anchor="middle">🖥️</text>
    <text x="455" y="132" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#0369a1" text-anchor="middle">
      <tspan x="455" dy="0">Server Hall &amp;</tspan>
      <tspan x="455" dy="22">Data Center</tspan>
    </text>
    <text x="455" y="180" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0284c7" text-anchor="middle">Critical Infrastructure (R-202)</text>
  </g>

  <!-- Open Workspace 203 (R-203) -->
  <g id="room-R-203">
    <rect x="610" y="35" width="190" height="210" fill="#ffffff" stroke="#64748b" stroke-width="3" rx="6"/>
    <text x="705" y="90" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" text-anchor="middle">💻</text>
    <text x="705" y="122" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Open Workspace 203</text>
    <text x="705" y="148" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Engineering &amp; Support</text>
  </g>

  <!-- Research Laboratory 204 (R-204) -->
  <g id="room-R-204">
    <rect x="820" y="35" width="140" height="210" fill="#ffffff" stroke="#64748b" stroke-width="3" rx="6"/>
    <text x="890" y="90" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" text-anchor="middle">🧪</text>
    <text x="890" y="122" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">
      <tspan x="890" dy="0">Research</tspan>
      <tspan x="890" dy="20">Lab 204</tspan>
    </text>
    <text x="890" y="172" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Testing &amp; Storage</text>
  </g>

  <!-- West Operations Corridor (C-02) -->
  <g id="room-C-02">
    <rect x="40" y="260" width="550" height="115" fill="#f1f5f9" stroke="#64748b" stroke-width="3" rx="6"/>
    <text x="315" y="325" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">West Operations Corridor (C-02)</text>
  </g>

  <!-- East Corridor (C-03) -->
  <g id="room-C-03">
    <rect x="610" y="260" width="190" height="115" fill="#f1f5f9" stroke="#64748b" stroke-width="3" rx="6"/>
    <text x="705" y="325" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">East Corridor (C-03)</text>
  </g>

  <!-- Stairwell & Lift Shaft S1 (S-01) -->
  <g id="room-S-01">
    <rect x="820" y="260" width="140" height="220" fill="#f1f5f9" stroke="#64748b" stroke-width="3" rx="6"/>
    <rect x="835" y="275" width="110" height="80" fill="#e2e8f0" stroke="#334155" stroke-width="2" rx="4"/>
    <text x="890" y="312" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" text-anchor="middle">🛗</text>
    <text x="890" y="338" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">LIFT 1</text>
    <text x="890" y="395" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" text-anchor="middle">🪜</text>
    <line x1="835" y1="415" x2="945" y2="415" stroke="#64748b" stroke-width="2"/>
    <line x1="835" y1="432" x2="945" y2="432" stroke="#64748b" stroke-width="2"/>
    <line x1="835" y1="449" x2="945" y2="449" stroke="#64748b" stroke-width="2"/>
    <text x="890" y="470" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">STAIRS S1</text>
  </g>

  <!-- Emergency Exit X-03 -->
  <g id="room-X-03">
    <rect x="610" y="390" width="190" height="90" fill="#dcfce7" stroke="#059669" stroke-width="4" rx="6"/>
    <text x="705" y="430" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" text-anchor="middle">🚪</text>
    <text x="705" y="456" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#047857" text-anchor="middle">EXIT X-03 (Fire Escape)</text>
  </g>
</svg>
